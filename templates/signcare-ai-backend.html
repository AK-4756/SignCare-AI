<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignCare AI - Real-Time Sign Language Translator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #06b6d4;
            --secondary: #0e7490;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #8b5cf6;
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Navigation */
        nav {
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #06b6d4 0%, #06b6d4 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .logo-text p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .api-status {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .api-status.connected {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .api-status.disconnected {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .api-status.connected .status-dot {
            background: #22c55e;
        }

        .api-status.disconnected .status-dot {
            background: #ef4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* Card */
        .card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            padding: 1.5rem;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.125rem;
            font-weight: 600;
        }

        .card-title svg {
            width: 20px;
            height: 20px;
            color: var(--primary);
        }

        /* Video Container */
        .video-container {
            position: relative;
            background: #000;
            border-radius: 1rem;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .video-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            color: var(--text-secondary);
        }

        .confidence-indicator {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 0.75rem;
            border-radius: 0.5rem;
            display: none;
        }

        .confidence-indicator.active {
            display: block;
        }

        .confidence-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .confidence-bar {
            width: 100px;
            height: 8px;
            background: rgba(51, 65, 85, 0.5);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #06b6d4, #0284c7);
            transition: width 0.3s;
        }

        .confidence-value {
            font-size: 0.75rem;
            color: var(--primary);
        }

        /* Input Fields */
        input[type="text"],
        textarea,
        select {
            width: 100%;
            background: rgba(71, 85, 105, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.75rem;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(71, 85, 105, 0.5);
        }

        .word-input {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        textarea {
            resize: none;
            min-height: 120px;
        }

        .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            display: block;
        }

        .mb-4 { margin-bottom: 1rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-2 { margin-bottom: 0.5rem; }

        /* Suggestions Grid */
        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .suggestion-btn {
            background: rgba(71, 85, 105, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.75rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.3s;
            color: var(--text-primary);
        }

        .suggestion-btn:hover {
            background: rgba(71, 85, 105, 0.7);
            border-color: var(--primary);
        }

        /* Buttons */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #06b6d4, #0284c7);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(71, 85, 105, 0.5);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(71, 85, 105, 0.7);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-success:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Status Cards */
        .status-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            background: rgba(71, 85, 105, 0.2);
            margin-bottom: 0.5rem;
        }

        .status-item.active {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .status-item.inactive {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-item.active .status-dot {
            background: #22c55e;
        }

        .status-item.inactive .status-dot {
            background: #ef4444;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 1.5rem;
            max-width: 800px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem;
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .close-btn {
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            margin-top: 4rem;
            padding: 2rem 1rem;
        }

        .footer-bottom {
            max-width: 1400px;
            margin: 0 auto;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Loading Animation */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(6, 182, 212, 0.3);
            border-top-color: #06b6d4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.5);
            color: #86efac;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-content">
            <div class="nav-left">
                <div class="logo">🤟</div>
                <div class="logo-text">
                    <h1>SignCare AI</h1>
                    <p>Real-time Sign Language Translator</p>
                </div>
            </div>
            <div class="api-status disconnected" id="apiStatus">
                <span class="status-dot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="grid">
            <!-- Left: Camera & Word Building -->
            <div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <span>⚡</span>
                            Hand Detection
                        </div>
                        <button id="cameraBtn" class="btn btn-primary" style="margin: 0; padding: 0.5rem 1rem; width: auto;">
                            ▶ Start Camera
                        </button>
                    </div>

                    <!-- Video/Canvas -->
                    <div class="video-container">
                        <canvas id="canvas" style="display: none;"></canvas>
                        <div id="videoPlaceholder" class="video-placeholder">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 60px; height: 60px;">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                            <p>Click "Start Camera" to begin</p>
                        </div>
                        <div id="confidenceIndicator" class="confidence-indicator">
                            <div class="confidence-label">Confidence</div>
                            <div class="confidence-bar">
                                <div id="confidenceFill" class="confidence-fill" style="width: 0%;"></div>
                            </div>
                            <div id="confidenceValue" class="confidence-value">0%</div>
                        </div>
                    </div>

                    <!-- Current Word -->
                    <div class="mb-4">
                        <label class="label">Current Letter</label>
                        <div style="font-size: 3rem; font-weight: bold; color: var(--primary); text-align: center; padding: 1rem; background: rgba(71, 85, 105, 0.2); border-radius: 0.5rem;">
                            <span id="currentLetterDisplay">-</span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="label">Current Word</label>
                        <input type="text" id="currentWord" class="word-input" placeholder="Your word will appear here..." readonly>
                    </div>

                    <!-- Suggestions -->
                    <div class="mb-4">
                        <label class="label">AI Suggestions (Press 1-5)</label>
                        <div class="suggestions-grid" id="suggestionsGrid">
                            <button class="suggestion-btn">Loading...</button>
                            <button class="suggestion-btn">Loading...</button>
                            <button class="suggestion-btn">Loading...</button>
                        </div>
                    </div>

                    <!-- Word Controls -->
                    <div class="button-grid">
                        <button id="addSpaceBtn" class="btn btn-primary">
                            ➜ Add Space
                        </button>
                        <button id="clearWordBtn" class="btn btn-secondary">
                            🗑 Clear Word
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: Sentence & Actions -->
            <div>
                <!-- Current Sentence -->
                <div class="card mb-4">
                    <label class="label">Current Sentence</label>
                    <textarea id="currentSentence" placeholder="Your sentence will appear here..." readonly></textarea>
                    <button id="clearSentenceBtn" class="btn btn-secondary" style="margin-top: 0.75rem;">
                        Clear Sentence
                    </button>
                </div>

                <!-- API Status -->
                <div class="card mb-4">
                    <div class="card-title" style="margin-bottom: 1rem;">
                        System Status
                    </div>
                    
                    <div class="status-item" id="apiStatusDetail">
                        <span class="status-dot"></span>
                        <span>API: Connecting...</span>
                    </div>
                    
                    <div class="status-item" id="cameraStatusDetail">
                        <span class="status-dot"></span>
                        <span>Camera: Standby</span>
                    </div>
                    
                    <div class="status-item" id="handStatusDetail">
                        <span class="status-dot"></span>
                        <span>Hand Detection: Waiting</span>
                    </div>
                </div>

                <!-- Actions -->
                <div class="card mb-4">
                    <div class="card-title" style="margin-bottom: 1rem;">
                        Actions
                    </div>

                    <select id="languageSelect" class="mb-3">
                        <option value="en">English 🇺🇸 / 🇮🇳</option>
                        <option value="hi">Hindi (हिन्दी) 🇮🇳</option>
                        <option value="gu">Gujarati (ગુજરાતી) 🇮🇳</option>
                        <option value="mr">Marathi (मराठी) 🇮🇳</option>
                        <option value="bn">Bengali (বাংলা) 🇮🇳</option>
                        <option value="ta">Tamil (தமிழ்) 🇮🇳</option>
                        <option value="te">Telugu (తెలుగు) 🇮🇳</option>
                        <option value="kn">Kannada (ಕನ್ನಡ) 🇮🇳</option>
                        <option value="ml">Malayalam (മലയാളം) 🇮🇳</option>
                        <option value="pa">Punjabi (ਪੰਜਾਬੀ) 🇮🇳</option>
                        <option value="ur">Urdu (اردو) 🇮🇳</option>
                        <option value="or">Odia (ଓଡ଼ିଆ) 🇮🇳</option>
                        <option value="as">Assamese (অসমীয়া) 🇮🇳</option>
                        <option value="sa">Sanskrit (संस्कृतम्) 🇮🇳</option>
                        <option value="es">Spanish 🇪🇸</option>
                        <option value="fr">French 🇫🇷</option>
                    </select>

                    <button id="translateBtn" class="btn btn-accent mb-2">
                        🌐 Translate
                    </button>

                    <button id="speakBtn" class="btn btn-success mb-2">
                        🔊 Speak
                    </button>

                    <div id="translationResult"></div>

                    <button id="saveBtn" class="btn btn-primary">
                        💾 Save to History
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom">
            <p>SignCare AI © 2024 • Powered by AI | Connecting with FastAPI Backend</p>
        </div>
    </footer>

    <script>
        // ===================================================
        // Configuration
        // ===================================================
        
        const API_URL = 'http://localhost:8000';
        const PREDICTION_INTERVAL = 300; // ms
        
        // ===================================================
        // State
        // ===================================================
        
        let cameraActive = false;
        let currentWord = '';
        let currentSentence = '';
        let currentLetter = '-';
        let confidence = 0;
        let suggestions = [];
        let selectedLanguage = 'en';
        let apiConnected = false;
        let stream = null;
        
        // Prediction stability
        let lastPrediction = null;
        let predictionCount = 0;
        const REQUIRED_STABLE_FRAMES = 15;
        let lastAddedLetter = null;
        
        // ===================================================
        // DOM Elements
        // ===================================================
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        const placeholderEl = document.getElementById('videoPlaceholder');
        const cameraBtn = document.getElementById('cameraBtn');
        const currentWordInput = document.getElementById('currentWord');
        const currentSentenceInput = document.getElementById('currentSentence');
        const currentLetterDisplay = document.getElementById('currentLetterDisplay');
        const addSpaceBtn = document.getElementById('addSpaceBtn');
        const clearWordBtn = document.getElementById('clearWordBtn');
        const clearSentenceBtn = document.getElementById('clearSentenceBtn');
        const speakBtn = document.getElementById('speakBtn');
        const saveBtn = document.getElementById('saveBtn');
        const languageSelect = document.getElementById('languageSelect');
        const apiStatus = document.getElementById('apiStatus');
        const statusText = document.getElementById('statusText');
        const confidenceIndicator = document.getElementById('confidenceIndicator');
        const confidenceFill = document.getElementById('confidenceFill');
        const confidenceValue = document.getElementById('confidenceValue');
        
        // ===================================================
        // API Connection Check
        // ===================================================
        
        async function checkApiConnection() {
            try {
                const response = await fetch(`${API_URL}/health`);
                if (response.ok) {
                    apiConnected = true;
                    updateApiStatus(true);
                    console.log('✅ Connected to FastAPI backend');
                } else {
                    updateApiStatus(false);
                }
            } catch (error) {
                console.error('❌ Cannot connect to API:', error);
                updateApiStatus(false);
            }
        }
        
        function updateApiStatus(connected) {
            apiConnected = connected;
            const statusEl = document.getElementById('apiStatus');
            const statusDetail = document.getElementById('apiStatusDetail');
            
            if (connected) {
                statusEl.classList.remove('disconnected');
                statusEl.classList.add('connected');
                statusText.textContent = '✅ API Connected';
                statusDetail.innerHTML = '<span class="status-dot"></span><span>API: Connected</span>';
                statusDetail.classList.add('active');
                statusDetail.classList.remove('inactive');
            } else {
                statusEl.classList.add('disconnected');
                statusEl.classList.remove('connected');
                statusText.textContent = '❌ API Disconnected';
                statusDetail.innerHTML = '<span class="status-dot"></span><span>API: Disconnected</span>';
                statusDetail.classList.remove('active');
                statusDetail.classList.add('inactive');
            }
        }
        
        // Check API every 3 seconds
        setInterval(checkApiConnection, 3000);
        checkApiConnection();
        
        // ===================================================
        // Camera & Real-time Prediction
        // ===================================================
        
        let predictionIntervalId = null;
        
        cameraBtn.addEventListener('click', async () => {
            if (!cameraActive) {
                try {
                    // Request camera with reasonable constraints
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { 
                            facingMode: 'user',
                            width: { ideal: 640, min: 320 },
                            height: { ideal: 480, min: 240 }
                        },
                        audio: false
                    });
                    
                    canvas.style.display = 'block';
                    placeholderEl.style.display = 'none';
                    confidenceIndicator.classList.add('active');
                    cameraBtn.textContent = '⏹ Stop Camera';
                    cameraBtn.classList.remove('btn-primary');
                    cameraBtn.classList.add('btn-danger');
                    cameraActive = true;
                    
                    // Update camera status
                    document.getElementById('cameraStatusDetail').innerHTML = '<span class="status-dot"></span><span>Camera: Active</span>';
                    document.getElementById('cameraStatusDetail').classList.add('active');
                    
                    // Create video element for streaming
                    const video = document.createElement('video');
                    video.autoplay = true;
                    video.playsinline = true;
                    video.muted = true;
                    video.style.display = 'none';
                    document.body.appendChild(video);
                    
                    // Set stream source
                    video.srcObject = stream;
                    
                    // Wait for video to be ready
                    video.onloadedmetadata = () => {
                        console.log('Video loaded:', video.videoWidth, 'x', video.videoHeight);
                        video.play().catch(e => console.error('Play error:', e));
                    };
                    
                    // Wait a bit for video to stabilize
                    setTimeout(() => {
                        startPredictionLoop(video);
                    }, 500);
                    
                } catch (err) {
                    console.error('Camera error:', err);
                    alert('❌ Camera access denied: ' + err.message);
                    cameraActive = false;
                    updateApiStatus(false);
                }
            } else {
                stopCamera();
            }
        });
        
        function stopCamera() {
            cameraActive = false;
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            if (predictionIntervalId) {
                clearInterval(predictionIntervalId);
                predictionIntervalId = null;
            }
            
            canvas.style.display = 'none';
            placeholderEl.style.display = 'flex';
            confidenceIndicator.classList.remove('active');
            cameraBtn.textContent = '▶ Start Camera';
            cameraBtn.classList.add('btn-primary');
            cameraBtn.classList.remove('btn-danger');
            
            // Update camera status
            document.getElementById('cameraStatusDetail').innerHTML = '<span class="status-dot"></span><span>Camera: Standby</span>';
            document.getElementById('cameraStatusDetail').classList.remove('active');
            
            // Reset displays
            currentLetterDisplay.textContent = '-';
            confidenceFill.style.width = '0%';
            confidenceValue.textContent = '0%';
        }
        
        async function startPredictionLoop(video) {
            // Wait for video to load and be ready
            await new Promise(resolve => {
                if (video.readyState >= 2) {
                    resolve();
                } else {
                    video.onloadedmetadata = () => resolve();
                    setTimeout(resolve, 1000);
                }
            });
            
            // Set canvas size from video dimensions
            if (video.videoWidth > 0 && video.videoHeight > 0) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            } else {
                canvas.width = 640;
                canvas.height = 480;
            }
            
            console.log(`Canvas set to: ${canvas.width}x${canvas.height}`);
            
            predictionIntervalId = setInterval(async () => {
                if (!cameraActive || !ctx) return;
                
                try {
                    // Ensure canvas has valid dimensions
                    if (canvas.width === 0 || canvas.height === 0) {
                        console.warn('Canvas has invalid dimensions');
                        return;
                    }
                    
                    // Draw video frame to canvas
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // Get canvas data as base64 with high quality
                    let imageData = canvas.toDataURL('image/jpeg', 0.9);
                    
                    // Verify image data is not empty
                    if (!imageData || imageData.length < 100) {
                        console.warn('Canvas image is empty or too small');
                        return;
                    }
                    
                    // Send to API for prediction
                    const response = await fetch(`${API_URL}/predict-base64`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            image: imageData
                        })
                    });
                    
                    if (!response.ok) {
                        const error = await response.json();
                        console.error('API error:', error);
                        throw new Error(error.error || 'Prediction failed');
                    }
                    
                    const result = await response.json();
                    processPrediction(result);
                    updateApiStatus(true);
                    
                } catch (error) {
                    console.error('Prediction error:', error);
                    if (error.message.includes('Failed to fetch')) {
                        updateApiStatus(false);
                    }
                }
            }, PREDICTION_INTERVAL);
        }
        
        function processPrediction(result) {
            const { letter, confidence: conf, hand_detected } = result;
            
            confidence = conf * 100;
            
            // Update confidence display
            confidenceFill.style.width = confidence + '%';
            confidenceValue.textContent = confidence.toFixed(1) + '%';
            
            if (!hand_detected) {
                currentLetter = '-';
                currentLetterDisplay.textContent = '-';
                lastPrediction = null;
                predictionCount = 0;
                lastAddedLetter = null;
                
                document.getElementById('handStatusDetail').innerHTML = '<span class="status-dot"></span><span>Hand Detection: Not Detected</span>';
                document.getElementById('handStatusDetail').classList.remove('active');
                return;
            }
            
            document.getElementById('handStatusDetail').innerHTML = '<span class="status-dot"></span><span>Hand Detection: Detected</span>';
            document.getElementById('handStatusDetail').classList.add('active');
            
            if (!letter) return;
            
            currentLetter = letter;
            currentLetterDisplay.textContent = letter;
            
            // Prediction stability check
            if (letter === lastPrediction) {
                predictionCount++;
            } else {
                lastPrediction = letter;
                predictionCount = 1;
                lastAddedLetter = null;
            }
            
            // Add letter when stable
            if (predictionCount >= REQUIRED_STABLE_FRAMES && lastAddedLetter !== letter && confidence > 0.6) {
                currentWord += letter;
                lastAddedLetter = letter;
                currentWordInput.value = currentWord;
                updateSuggestions();
            }
        }

        async function translateTextAsync(text, targetLang) {
            if (!text || !text.trim()) return '';
            const cleanText = text.trim();
            if (targetLang === 'en') return cleanText;

            const upper = cleanText.toUpperCase();
            if (TRANSLATION_DICTIONARY[upper] && TRANSLATION_DICTIONARY[upper][targetLang]) {
                return TRANSLATION_DICTIONARY[upper][targetLang];
            }

            const words = upper.split(/\s+/);
            const translatedWords = words.map(w => {
                if (TRANSLATION_DICTIONARY[w] && TRANSLATION_DICTIONARY[w][targetLang]) {
                    return TRANSLATION_DICTIONARY[w][targetLang];
                }
                return null;
            });
            const allMatched = translatedWords.every(w => w !== null);
            if (allMatched && words.length > 0) {
                return translatedWords.join(' ');
            }

            // Online Google Translate API
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3500);
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetLang}&dt=t&q=${encodeURIComponent(cleanText)}`;
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data[0] && data[0][0] && data[0][0][0]) {
                        return data[0].map(item => item[0]).join('');
                    }
                }
            } catch (err) {
                console.warn('Online Google translation failed, trying MyMemory:', err);
            }

            // Online MyMemory API fallback
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3500);
                const mmUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanText)}&langpair=en|${targetLang}`;
                const res = await fetch(mmUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.responseData && data.responseData.translatedText) {
                        return data.responseData.translatedText;
                    }
                }
            } catch (err) {
                console.warn('MyMemory translation failed:', err);
            }

            // Partial dictionary fallback
            if (words.length > 1) {
                return words.map(w => (TRANSLATION_DICTIONARY[w] && TRANSLATION_DICTIONARY[w][targetLang]) ? TRANSLATION_DICTIONARY[w][targetLang] : w).join(' ');
            }

            return cleanText;
        }

                    textToSpeak = translationEl.textContent;
                } else {
                    textToSpeak = await translateTextAsync(rawText, selectedLanguage);
                }
            }

            try {
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                const targetVoiceLang = LANGUAGE_VOICES[selectedLanguage] || 'en-US';
                utterance.lang = targetVoiceLang;

                if (window.speechSynthesis) {
                    const voices = window.speechSynthesis.getVoices();
                    const voice = voices.find(v => v.lang === targetVoiceLang || v.lang.startsWith(selectedLanguage));
                    if (voice) {
                        utterance.voice = voice;
                    }
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.speak(utterance);
                }
            } catch (err) {
                console.error('Speech error:', err);
            }
        });
        
        // ===================================================
        // History Management
        // ===================================================
        
        saveBtn.addEventListener('click', () => {
            if (!currentSentence.trim()) {
                alert('No sentence to save');
                return;
            }
            
            const history = JSON.parse(localStorage.getItem('signcare_history') || '[]');
            history.unshift({
                id: Date.now(),
                asl: currentSentence,
                language: selectedLanguage,
                timestamp: new Date().toLocaleString()
            });
            localStorage.setItem('signcare_history', JSON.stringify(history));
            
            currentSentence = '';
            currentSentenceInput.value = '';
            currentWord = '';
            currentWordInput.value = '';
            updateSuggestions();
            
            alert('✅ Saved to history!');
        });
        
        languageSelect.addEventListener('change', (e) => {
            selectedLanguage = e.target.value;
        });
        
        // ===================================================
        // Initialize
        // ===================================================
        
        updateSuggestions();
        checkApiConnection();
    </script>
</body>
</html>
